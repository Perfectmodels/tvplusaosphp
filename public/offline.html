<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne · TV+A OS</title>
    <meta name="theme-color" content="#001a41">
    <link rel="manifest" href="/manifest.webmanifest?v=2">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="/favicon-32x32.png?v=2" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="/favicon.ico?v=2" type="image/x-icon">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #F4F7F9;
            color: #14171C;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #E6EBF2;
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: 0 18px 45px rgba(0, 26, 65, .08);
        }
        .logo {
            width: 92px;
            height: 92px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: #001a41;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            line-height: 1.25;
            color: #001a41;
        }
        p {
            margin: 0 0 24px;
            font-size: 14px;
            line-height: 1.6;
            color: #5B6270;
        }
        button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            background: #0054cd;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .2s ease;
        }
        button:hover, button:focus-visible { background: #001a41; }
        .brand {
            margin-top: 26px;
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #8A909C;
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="logo" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M8 32c5.8-9 13.5-14 24-14s18.2 5 24 14c-5.8 9-13.5 14-24 14S13.8 41 8 32Z" fill="#fff"/>
                <circle cx="32" cy="32" r="10.5" fill="#0054cd"/>
                <circle cx="32" cy="32" r="5" fill="#001a41"/>
                <circle cx="28.5" cy="28.5" r="2" fill="#fff"/>
            </svg>
        </div>
        <h1>Vous êtes hors ligne</h1>
        <p>
            TV+A OS n’a pas pu joindre le réseau. Vérifiez votre connexion Internet,
            puis réessayez — vous retrouverez votre espace là où vous l’avez laissé.
        </p>
        <button type="button" onclick="window.location.reload()">Réessayer maintenant</button>
        <p class="brand">Informer. Coordonner. Inspirer.</p>
    </main>
    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
