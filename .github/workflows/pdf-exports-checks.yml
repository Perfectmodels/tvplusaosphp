name: TV+A OS PDF export checks

on:
  pull_request:
    paths:
      - "app/Services/Pdf/**"
      - "app/Services/ConducteurPdfExporter.php"
      - "app/Http/Controllers/ConducteurExportController.php"
      - "routes/module_autres.php"
      - "resources/views/conducteur_redaction.blade.php"
      - "tests/Feature/ConducteurExportPdfTest.php"
      - ".github/workflows/pdf-exports-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: PHP 8.3 syntax and PDF regression tests
    runs-on: ubuntu-22.04
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, curl, dom, xml, exif, bcmath
          coverage: none
          tools: composer:v2
      - name: Check PDF PHP syntax
        run: |
          php -l app/Services/Pdf/TvAosTrueTypeFont.php
          php -l app/Services/Pdf/TvAosPdfDocument.php
          php -l app/Services/ConducteurPdfExporter.php
          php -l app/Http/Controllers/ConducteurExportController.php
          php -l tests/Feature/ConducteurExportPdfTest.php
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PDF regressions
        run: php artisan test --filter=ConducteurExportPdfTest
